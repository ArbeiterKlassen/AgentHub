<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="AgentHub：人和多个 AI CLI（Codex / Claude Code / 本地模型…）在同一个群聊里协作" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 手机上「添加到主屏幕」后以独立窗口打开，不显示 Safari 的地址栏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgentHub" />
    <title>AgentHub · 人机群聊</title>
    <!-- 首屏防闪：在样式表生效前就把持久化主题贴到 <html>，避免深色用户看到一帧白屏 -->
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('agenthub-ui');
          if (!raw) return;
          var theme = (JSON.parse(raw) || {}).state.theme;
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            document.documentElement.style.colorScheme = theme;
          }
        } catch (err) {
          /* localStorage 被禁用或内容损坏时忽略 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
